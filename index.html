<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borgo Verde</title>
  <link rel="stylesheet" href="css/style.css?v=0.3.0">
</head>
<body>
  <header class="topbar">
    <h1 id="app-title">Borgo Verde</h1>
    <div class="topbar-actions">
      <label class="lang-label"><span class="sr-only" id="lang-label-text"></span>
        <select id="lang-select"></select>
      </label>
      <button type="button" id="btn-manual" class="btn"></button>
      <button type="button" id="btn-results" class="btn" hidden></button>
      <button type="button" id="btn-new" class="btn"></button>
    </div>
  </header>

  <main class="layout">
    <div class="play-col">
      <section id="city-panel" class="city-panel"></section>
      <section class="board-area" id="board-area">
        <div class="board-scaler" id="board-scaler">
          <div class="board" id="board"></div>
        </div>
      </section>
    </div>
    <aside class="sidebar">
      <section id="roles-side" class="cp-block roles-side" hidden></section>
      <section id="action-panel" class="panel action-panel" aria-live="polite"></section>
      <section id="players" class="players"></section>
      <section class="panel log-panel">
        <div class="log-head">
          <h2 id="log-title"></h2>
          <button type="button" id="log-toggle" class="btn btn-small"></button>
        </div>
        <ol id="log" class="log"></ol>
      </section>
    </aside>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
  </div>

  <div id="manual" class="manual" hidden>
    <div class="manual-card" role="dialog" aria-modal="true" aria-labelledby="manual-title">
      <header class="manual-head">
        <h2 id="manual-title"></h2>
        <button type="button" id="manual-close" class="btn"></button>
      </header>
      <div class="manual-body">
        <nav id="manual-toc" class="manual-toc"></nav>
        <article id="manual-content" class="manual-content" tabindex="-1"></article>
      </div>
    </div>
  </div>

  <noscript>Borgo Verde richiede JavaScript. / Greenburg needs JavaScript.</noscript>

  <script src="js/config.js?v=0.3.0"></script>
  <script src="js/catalog.js?v=0.3.0"></script>
  <script src="js/rng.js?v=0.3.0"></script>
  <script src="js/i18n.js?v=0.3.0"></script>
  <script src="js/i18n/it.js?v=0.3.0"></script>
  <script src="js/i18n/en.js?v=0.3.0"></script>
  <script src="js/manual/it.js?v=0.3.0"></script>
  <script src="js/manual/en.js?v=0.3.0"></script>
  <script src="js/engine.js?v=0.3.0"></script>
  <script src="js/ui.js?v=0.3.0"></script>
  <script src="js/app.js?v=0.3.0"></script>
</body>
</html>
